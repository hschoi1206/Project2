# 주기 기록 앱(cycle/)을 Capacitor로 감싸 안드로이드 APK를 만든다.
# - push(cycle/, apk/ 변경): 빌드 확인. 서명 비밀값이 있으면 서명된 APK를 Actions 아티팩트로 올린다.
# - 수동 실행(workflow_dispatch): 서명된 APK를 만들고 GitHub Release v<버전>에 올린다.
# 서명 비밀값: 저장소 Settings → Secrets and variables → Actions
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (키 별칭은 weight: 체중 앱과 같은 키를 재사용)
name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['cycle/**', 'apk/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apk/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install and copy web app
        run: |
          npm ci
          npm run copy-web

      - name: Create Android project
        run: |
          npx cap add android
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -nE "versionCode|versionName|applicationId" android/app/build.gradle
          cp -r res/* android/app/src/main/res/
          npx cap sync android

      - name: Build unsigned release APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        if: env.KS_B64 != '' && env.KS_PW != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="cycle-tracker-$APP_VERSION.apk"
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.jks" --ks-key-alias weight \
            --ks-pass env:KS_PW --key-pass env:KS_PW --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          rm -f "$RUNNER_TEMP/ks.jks"
          echo "APK_FILE=$OUT" >> "$GITHUB_ENV"

      - name: No signing secrets
        if: env.KS_B64 == '' || env.KS_PW == ''
        run: |
          echo "::warning::서명 비밀값이 없어 서명된 APK를 만들지 않았습니다 (빌드 확인만 함)."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::릴리스에는 ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD 비밀값이 필요합니다."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: env.APK_FILE != ''
        with:
          name: cycle-tracker-apk
          path: apk/${{ env.APK_FILE }}

      - name: GitHub Release
        if: github.event_name == 'workflow_dispatch' && env.APK_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$APP_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" --target "$GITHUB_SHA" --title "주기 기록 $TAG" \
              --notes "안드로이드 앱(APK). 폰에서 아래 cycle-tracker-$APP_VERSION.apk 를 받아 설치하세요. 처음 설치할 때 '출처를 알 수 없는 앱 설치'를 허용해야 합니다."
          fi
