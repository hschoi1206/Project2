<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>난수 생성기</title>
<style>
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --fg: #1d2733;
  --muted: #637083;
  --line: #d5dce4;
  --accent: #2f6fdb;
  --error: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --panel: #1b222b; --fg: #e3e8ee; --muted: #93a0b0;
    --line: #2c3743; --accent: #6b9cf0; --error: #ef7a6c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1b222b; --fg: #e3e8ee; --muted: #93a0b0;
  --line: #2c3743; --accent: #6b9cf0; --error: #ef7a6c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  padding-inline: 16px;
  padding-block: 32px;
}
main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 24px; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
form {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  border-radius: 8px;
}
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
input[type="number"] {
  font: inherit;
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px 10px;
  width: 100%;
}
.row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; }
.check { display: flex; align-items: center; gap: 6px; color: var(--fg); }
button {
  font: inherit;
  font-weight: 600;
  border: 0;
  border-radius: 6px;
  padding: 10px 18px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
}
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.error { margin: 0; color: var(--error); font-size: 13px; min-height: 1.5em; }
.result-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.result-head span { color: var(--muted); font-size: 13px; }
#output {
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-wrap: wrap; gap: 8px;
}
#output li {
  min-width: 3.2em;
  text-align: center;
  padding: 6px 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
}
@media (max-width: 480px) { form { grid-template-columns: 1fr 1fr; } form label:first-child { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>난수 생성기</h1>
    <p class="sub">개수를 입력하면 지정한 범위 안에서 정수 난수를 만듭니다.</p>
  </header>

  <form id="form" novalidate>
    <label for="count">개수 (1~10,000)
      <input type="number" id="count" min="1" max="10000" value="10" required>
    </label>
    <label for="min">최솟값
      <input type="number" id="min" value="1" required>
    </label>
    <label for="max">최댓값
      <input type="number" id="max" value="100" required>
    </label>
    <div class="row">
      <label class="check" for="unique"><input type="checkbox" id="unique"> 중복 없이</label>
      <button type="submit">생성</button>
    </div>
  </form>

  <p class="error" id="error" role="alert"></p>

  <section>
    <div class="result-head">
      <span id="summary"></span>
      <button type="button" class="ghost" id="copy">복사</button>
    </div>
    <ul id="output"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

// 0 이상 n 미만의 균등한 정수 (crypto 사용, 모듈로 편향 제거)
function randInt(n) {
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % n;
}

function generate(count, min, max, unique) {
  const range = max - min + 1;
  if (!unique) return Array.from({ length: count }, () => min + randInt(range));
  // 중복 없이: 부분 Fisher–Yates 셔플
  const picked = new Map();
  const out = [];
  for (let i = 0; i < count; i++) {
    const j = i + randInt(range - i);
    const vj = picked.has(j) ? picked.get(j) : j;
    const vi = picked.has(i) ? picked.get(i) : i;
    picked.set(j, vi);
    out.push(min + vj);
  }
  return out;
}

function validate(count, min, max, unique) {
  if (![count, min, max].every(Number.isInteger)) return '모든 칸에 정수를 입력하세요.';
  if (count < 1 || count > 10000) return '개수는 1부터 10,000 사이로 입력하세요.';
  if (min > max) return '최솟값이 최댓값보다 클 수 없습니다.';
  if (max - min + 1 > 0xFFFFFFFF) return '범위가 너무 넓습니다. 약 42억 이하로 줄이세요.';
  if (unique && count > max - min + 1)
    return `중복 없이 뽑으려면 개수가 범위 안의 숫자 수(${max - min + 1}개) 이하여야 합니다.`;
  return '';
}

let last = [];

function run(e) {
  e?.preventDefault();
  const count = Number($('count').value);
  const min = Number($('min').value);
  const max = Number($('max').value);
  const unique = $('unique').checked;
  const err = validate(count, min, max, unique);
  $('error').textContent = err;
  if (err) return;

  last = generate(count, min, max, unique);
  const frag = document.createDocumentFragment();
  last.forEach(n => { const li = document.createElement('li'); li.textContent = n; frag.appendChild(li); });
  $('output').replaceChildren(frag);
  const sum = last.reduce((a, b) => a + b, 0);
  $('summary').textContent =
    `${count.toLocaleString()}개 · 범위 ${min}~${max}${unique ? ' · 중복 없음' : ''} · 평균 ${(sum / count).toFixed(2)}`;
  $('copy').textContent = '복사';
}

$('form').addEventListener('submit', run);

$('copy').addEventListener('click', async () => {
  if (!last.length) return;
  try {
    await navigator.clipboard.writeText(last.join(', '));
    $('copy').textContent = '복사됨';
  } catch {
    const range = document.createRange();
    range.selectNodeContents($('output'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    $('copy').textContent = '선택됨 · 직접 복사하세요';
  }
});

run();
</script>
</body>
</html>
