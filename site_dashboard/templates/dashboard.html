<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 보고 대시보드</title>
<style>
  /* 디자인 규칙: 레포 최상위 CLAUDE.md (보고서 양식형, 그레이 모노톤, 강조색은 적색 1종) */
  :root {
    color-scheme: light;
    --black: #000000;
    --ink: #333333;
    --ink-2: #666666;
    --muted: #999999;
    --line: #bfbfbf;
    --grid: #e5e5e5;
    --head: #f2f2f2;
    --page: #ffffff;
    --red: #a50000;
    --font: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 13px/1.55 var(--font); }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
  b, strong, th { font-weight: 700; }

  /* 표제 */
  .doc-head { border-bottom: 2px solid var(--black); padding-bottom: 8px; margin-bottom: 12px;
              display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; }
  h1 { font-size: 18px; font-weight: 700; color: var(--black); margin: 0; }
  .doc-head .period { font-size: 13px; color: var(--ink-2); }

  /* 공통 표 */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: middle; }
  th { background: var(--head); color: var(--black); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.c, th.c { text-align: center; }

  /* 개요표 · KPI표 */
  .info { min-width: 640px; }
  .info th { width: 1%; }
  .kpi { margin-top: 12px; table-layout: fixed; min-width: 640px; }
  .kpi th { text-align: center; }
  .kpi td { text-align: center; padding: 8px; }
  .kpi .v { font-size: 22px; font-weight: 700; color: var(--black); font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 2px; }
  .kpi .s { font-size: 12px; color: var(--ink-2); }

  .neg, .bad { color: var(--red); }

  /* 구획 */
  section { margin-top: 16px; }
  h2 { font-size: 14px; font-weight: 700; color: var(--black); margin: 0 0 6px; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .cols > div { min-width: 0; display: flex; flex-direction: column; }
  .cols .box { flex: 1; }
  .box { border: 1px solid var(--line); padding: 10px 12px; }
  .box-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .legend { display: flex; gap: 14px; }
  .legend svg { vertical-align: middle; margin-right: 4px; }

  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; font-family: var(--font); }
  .chart text { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart text.end { fill: var(--black); font-size: 12px; font-weight: 700; }
  .chart rect.hit:focus { outline: 1px solid var(--black); }
  .tip { position: absolute; pointer-events: none; display: none; background: var(--page); border: 1px solid var(--ink);
         padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 2; }
  .tip table { width: auto; font-size: 12px; }
  .tip td { border: 0; padding: 1px 4px; }

  .note { margin-top: 8px; border: 1px solid var(--line); border-left: 3px solid var(--red); padding: 6px 10px; font-size: 13px; }
  .note b { color: var(--red); }

  details { margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  details summary { cursor: pointer; }
  details table { margin-top: 6px; }

  /* 리스크 */
  .risk-sum { width: auto; min-width: 420px; }
  .risk-sum td, .risk-sum th { text-align: center; min-width: 70px; }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; margin: 10px 0 6px; }
  .filters { display: flex; }
  .filters button { font: inherit; font-size: 12px; padding: 3px 12px; cursor: pointer; border: 1px solid var(--line);
                    margin-left: -1px; background: var(--page); color: var(--ink); border-radius: 0; }
  .filters button:first-child { margin-left: 0; }
  .filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--page); position: relative; }
  .filters button:focus-visible { outline: 2px solid var(--black); outline-offset: 1px; position: relative; }
  #risk-table { min-width: 860px; }
  #risk-table td:first-child { white-space: nowrap; }
  .grade-High { font-weight: 700; color: var(--black); }
  .sub { font-size: 12px; color: var(--ink-2); }
  tr.done td { color: var(--muted); }
  .due-over { color: var(--red); font-weight: 700; white-space: nowrap; }
  .sub.bad { color: var(--red); }

  footer { margin-top: 16px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; }

  @media (max-width: 860px) {
    .cols { grid-template-columns: 1fr; }
  }
  @media print { details, .filters { display: none; } }
</style>
</head>
<body>
<main>
  <div class="doc-head">
    <h1 id="title"></h1>
    <span class="period" id="period"></span>
  </div>

  <div class="scroll"><table class="info" id="info"></table></div>
  <div class="scroll"><table class="kpi" id="kpi"></table></div>

  <section class="cols">
    <div>
      <h2>1. 공정률 추이 (누계)</h2>
      <div class="box">
        <div class="box-head"><span>단위: %</span><span class="legend" data-legend></span></div>
        <div class="chart" id="chart-progress"></div>
        <details><summary>데이터 표 보기</summary><div class="scroll" id="table-progress"></div></details>
      </div>
    </div>
    <div>
      <h2>2. 예산 집행 추이 (누계)</h2>
      <div class="box">
        <div class="box-head"><span id="budget-unit"></span><span class="legend" data-legend></span></div>
        <div class="chart" id="chart-budget"></div>
        <div id="budget-note"></div>
        <details><summary>데이터 표 보기</summary><div class="scroll" id="table-budget"></div></details>
      </div>
    </div>
  </section>

  <section>
    <h2>3. 리스크 진행 현황</h2>
    <div class="scroll"><table class="risk-sum" id="risk-sum"></table></div>
    <div class="toolbar">
      <span class="sub">등급 = 영향도 × 발생가능성 (상3·중2·하1, 6 이상 High / 3~4 Medium / 1~2 Low)</span>
      <div class="filters" id="filters" role="group" aria-label="리스크 표 필터"></div>
    </div>
    <div class="scroll"><table id="risk-table"></table></div>
  </section>

  <footer id="footer"></footer>
</main>

<script id="dashboard-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("dashboard-data").textContent);
  const $ = (id) => document.getElementById(id);
  const fmt = (n, d = 1) => Number(n).toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
  const el = (tag, attrs = {}, text) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const SVG = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs = {}) => {
    const e = document.createElementNS(SVG, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  // 회계식 증감 표기: 음수는 △ + 적색, 양수는 + 부호. badIfPositive면 양수도 적색.
  const acct = (v, unit = "", d = 1, badIfPositive = false) => {
    const r = Number(v.toFixed(d));
    if (r < 0) return el("span", { class: "neg" }, `△${fmt(-r, d)}${unit}`);
    const text = r > 0 ? `+${fmt(r, d)}${unit}` : `${fmt(0, d)}${unit}`;
    return el("span", r > 0 && badIfPositive ? { class: "bad" } : {}, text);
  };
  const td = (content, attrs = {}) => {
    const c = el("td", attrs);
    (Array.isArray(content) ? content : [content]).forEach((n) => c.append(typeof n === "string" ? document.createTextNode(n) : n));
    return c;
  };

  // ---------- 표제 · 개요 ----------
  const s = D.site;
  const [y, m] = D.meta.report_month.split("-").map(Number);
  $("title").textContent = `${s["현장명"]} 월간 현장 보고`;
  $("period").textContent = `보고기준: ${y}년 ${m}월 말`;

  const start = new Date(s["공사기간_시작"]), end = new Date(s["공사기간_종료"]);
  const monthEnd = new Date(y, m, 0);
  const elapsed = Math.min(100, Math.max(0, (monthEnd - start) / (end - start) * 100));

  const info = $("info");
  [[["발주처", s["발주처"]], ["현장소장", s["현장소장"]], ["위치", s["위치"]]],
   [["공사기간", `${s["공사기간_시작"]} ~ ${s["공사기간_종료"]}`], ["계약금액", `${fmt(s["계약금액_억원"], 0)}억원`],
    ["실행예산", `${fmt(s["실행예산_억원"], 0)}억원`]]].forEach((row) => {
    const tr = el("tr");
    row.forEach(([k, v]) => tr.append(el("th", {}, k), el("td", {}, v ?? "-")));
    info.appendChild(tr);
  });
  if (s["주요공종"]) {
    const tr = el("tr");
    tr.append(el("th", {}, "주요공종"), el("td", { colspan: 5 }, s["주요공종"]));
    info.appendChild(tr);
  }

  // ---------- KPI 표 ----------
  const P = D.progress.latest, B = D.budget.latest, R = D.risks.summary;
  const kpis = [
    ["공정률 (실적)", fmt(P.actual), "%", [`계획 ${fmt(P.plan)}% 대비 `, acct(P.gap, "%p")]],
    ["예산 집행률", fmt(B.actual_rate), "%", [`계획 ${fmt(B.plan_rate)}% 대비 `, acct(B.actual_rate - B.plan_rate, "%p", 1, true)]],
    ["미해결 리스크", String(R.open), "건", [`High ${R.open_by_grade.High} / Medium ${R.open_by_grade.Medium} / Low ${R.open_by_grade.Low}`]],
    ["공기 경과율", fmt(elapsed), "%", ["기한초과 리스크 ", el("span", R.overdue ? { class: "bad" } : {}, `${R.overdue}건`)]],
  ];
  const kh = el("tr"), kv = el("tr"), ks = el("tr");
  kpis.forEach(([label, value, unit, sub]) => {
    kh.appendChild(el("th", {}, label));
    const v = el("span", { class: "v" }, value); v.appendChild(el("small", {}, unit));
    kv.appendChild(td(v));
    ks.appendChild(td(sub.map((x) => typeof x === "string" ? x : x), { class: "s" }));
  });
  $("kpi").append(kh, kv, ks);

  // ---------- 선 차트 ----------
  const STYLE = {
    actual: { stroke: "#000000", width: 2, dash: null, name: "실적" },
    plan: { stroke: "#999999", width: 1.5, dash: "5 3", name: "계획" },
  };
  document.querySelectorAll("[data-legend]").forEach((lg) => {
    ["actual", "plan"].forEach((k) => {
      const sp = el("span");
      const sv = svgEl("svg", { width: 20, height: 6, "aria-hidden": "true" });
      sv.appendChild(svgEl("line", { x1: 0, x2: 20, y1: 3, y2: 3, stroke: STYLE[k].stroke, "stroke-width": STYLE[k].width, ...(STYLE[k].dash ? { "stroke-dasharray": STYLE[k].dash } : {}) }));
      sp.append(sv, document.createTextNode(STYLE[k].name));
      lg.appendChild(sp);
    });
  });

  function lineChart(host, series, opts) {
    const W = 560, H = 250, M = { t: 10, r: 60, b: 26, l: 40 };
    const iw = W - M.l - M.r, ih = H - M.t - M.b;
    const n = series.length;
    const maxV = opts.max ?? Math.max(...series.flatMap((d) => [d.plan, d.actual]));
    const step = opts.tick ?? Math.ceil(maxV / 4 / 100) * 100;
    const top = Math.ceil(maxV / step) * step;
    const x = (i) => M.l + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const yS = (v) => M.t + ih - (v / top) * ih;
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": opts.aria });

    for (let v = 0; v <= top; v += step) {
      svg.appendChild(svgEl("line", { x1: M.l, x2: M.l + iw, y1: yS(v), y2: yS(v), stroke: v === 0 ? "#333333" : "#e5e5e5", "stroke-width": 1 }));
      const t = svgEl("text", { x: M.l - 6, y: yS(v) + 4, "text-anchor": "end" });
      t.textContent = v.toLocaleString("ko-KR");
      svg.appendChild(t);
    }
    const every = Math.max(1, Math.ceil(n / 6));
    series.forEach((d, i) => {
      if (i % every && i !== n - 1) return;
      const t = svgEl("text", { x: x(i), y: H - 8, "text-anchor": "middle" });
      t.textContent = d.month.slice(2).replace("-", ".");
      svg.appendChild(t);
    });

    ["plan", "actual"].forEach((k) => {
      const st = STYLE[k];
      const dAttr = series.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${yS(d[k]).toFixed(1)}`).join("");
      svg.appendChild(svgEl("path", { d: dAttr, fill: "none", stroke: st.stroke, "stroke-width": st.width, "stroke-linejoin": "round", ...(st.dash ? { "stroke-dasharray": st.dash } : {}) }));
    });
    const last = series[n - 1];
    const ends = ["actual", "plan"].map((k) => ({ k, y: yS(last[k]) }));
    if (Math.abs(ends[0].y - ends[1].y) < 14) {
      const hi = ends[0].y < ends[1].y ? 0 : 1, mid = (ends[0].y + ends[1].y) / 2;
      ends[hi].ly = mid - 7; ends[1 - hi].ly = mid + 7;
    }
    ends.forEach((e) => {
      svg.appendChild(svgEl("circle", { cx: x(n - 1), cy: e.y, r: 3, fill: STYLE[e.k].stroke }));
      const t = svgEl("text", { x: x(n - 1) + 7, y: (e.ly ?? e.y) + 4, class: e.k === "actual" ? "end" : "" });
      t.textContent = opts.label(last[e.k]);
      svg.appendChild(t);
    });

    const cross = svgEl("line", { y1: M.t, y2: M.t + ih, stroke: "#666666", "stroke-width": 1, visibility: "hidden" });
    svg.appendChild(cross);
    const hit = svgEl("rect", { class: "hit", x: M.l, y: M.t, width: iw, height: ih, fill: "transparent", tabindex: 0 });
    svg.appendChild(hit);
    host.appendChild(svg);
    const tip = el("div", { class: "tip" });
    host.appendChild(tip);

    const show = (i) => {
      const d = series[i];
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      const t = el("table");
      const cap = el("tr"); cap.appendChild(el("td", { colspan: 2 }, d.month)); t.appendChild(cap);
      [["실적", opts.label(d.actual)], ["계획", opts.label(d.plan)]].forEach(([k, v]) => {
        const tr = el("tr"); tr.append(el("td", {}, k), el("td", { class: "num" }, v)); t.appendChild(tr);
      });
      const tr = el("tr"); tr.append(el("td", {}, "차이"), td(acct(d.actual - d.plan, opts.gapUnit, opts.gapDigits, opts.overIsBad), { class: "num" }));
      t.appendChild(tr);
      tip.replaceChildren(t);
      tip.style.display = "block";
      const scale = host.clientWidth / W;
      const px = x(i) * scale;
      const left = px + 10 + tip.offsetWidth > host.clientWidth ? px - 10 - tip.offsetWidth : px + 10;
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${M.t * scale}px`;
    };
    const hide = () => { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); };
    hit.addEventListener("pointermove", (ev) => {
      const r = svg.getBoundingClientRect();
      const sx = (ev.clientX - r.left) * (W / r.width);
      show(Math.max(0, Math.min(n - 1, Math.round(((sx - M.l) / iw) * (n - 1)))));
    });
    hit.addEventListener("pointerleave", hide);
    let kbd = n - 1;
    hit.addEventListener("focus", () => show(kbd));
    hit.addEventListener("blur", hide);
    hit.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft") kbd = Math.max(0, kbd - 1);
      else if (ev.key === "ArrowRight") kbd = Math.min(n - 1, kbd + 1);
      else return;
      ev.preventDefault(); show(kbd);
    });
  }

  function seriesTable(host, series, unit, digits, overIsBad) {
    const t = el("table");
    const head = el("tr");
    ["보고월", `계획 (${unit})`, `실적 (${unit})`, "차이"].forEach((h, i) => head.appendChild(el("th", { class: i ? "num" : "c" }, h)));
    t.appendChild(head);
    [...series].reverse().forEach((d) => {
      const tr = el("tr");
      tr.append(el("td", { class: "c" }, d.month), el("td", { class: "num" }, fmt(d.plan, digits)),
                el("td", { class: "num" }, fmt(d.actual, digits)), td(acct(d.actual - d.plan, "", digits, overIsBad), { class: "num" }));
      t.appendChild(tr);
    });
    host.appendChild(t);
  }

  lineChart($("chart-progress"), D.progress.history, {
    max: 100, tick: 25, label: (v) => `${fmt(v)}%`, gapUnit: "%p", gapDigits: 1, overIsBad: false, aria: "공정률 계획 대비 실적 추이",
  });
  seriesTable($("table-progress"), D.progress.history, "%", 1, false);

  $("budget-unit").textContent = `단위: 억원 (실행예산 ${fmt(D.budget.total, 0)}억원)`;
  lineChart($("chart-budget"), D.budget.history, {
    label: (v) => `${fmt(v, 0)}억`, gapUnit: "억원", gapDigits: 0, overIsBad: true, aria: "예산 집행 계획 대비 실적 추이",
  });
  seriesTable($("table-budget"), D.budget.history, "억원", 0, true);

  const spread = B.actual_rate - P.actual;
  if (spread >= 3) {
    const note = el("div", { class: "note" });
    note.append(el("b", {}, "[원가 주의] "),
      document.createTextNode(`예산 집행률(${fmt(B.actual_rate)}%)이 공정률(${fmt(P.actual)}%)보다 ${fmt(spread)}%p 높음. 기성 대비 원가 투입 선행.`));
    $("budget-note").appendChild(note);
  }

  // ---------- 리스크 ----------
  const STATUSES = ["미착수", "진행중", "완료"];
  const sum = $("risk-sum");
  const h = el("tr"), v = el("tr");
  [...STATUSES, "계", "기한초과"].forEach((k) => h.appendChild(el("th", {}, k)));
  STATUSES.forEach((k) => v.appendChild(el("td", { class: "num" }, `${R.by_status[k]}건`)));
  v.appendChild(td(el("b", {}, `${R.total}건`), { class: "num" }));
  v.appendChild(td(el("span", R.overdue ? { class: "bad" } : {}, `${R.overdue}건`), { class: "num" }));
  sum.append(h, v);

  const ORDER = { High: 0, Medium: 1, Low: 2 };
  const items = [...D.risks.items].sort((a, b) =>
    (a.status === "완료") - (b.status === "완료") || b.overdue - a.overdue || ORDER[a.grade] - ORDER[b.grade] || a.id.localeCompare(b.id));
  const filters = [["미해결", (r) => r.status !== "완료"], ["전체", () => true], ["High", (r) => r.grade === "High"], ["기한초과", (r) => r.overdue]];
  let active = 0;
  const renderTable = () => {
    const t = $("risk-table");
    t.replaceChildren();
    const head = el("tr");
    [["ID", "c"], ["등급", "c"], ["리스크 항목", ""], ["분류", "c"], ["담당", "c"], ["조치계획", ""], ["상태", "c"], ["목표완료일", "c"]]
      .forEach(([h, c]) => head.appendChild(el("th", c ? { class: c } : {}, h)));
    t.appendChild(head);
    const rows = items.filter(filters[active][1]);
    if (!rows.length) {
      const tr = el("tr"); tr.appendChild(el("td", { colspan: 8, class: "c" }, "해당 항목 없음")); t.appendChild(tr);
    }
    rows.forEach((r) => {
      const tr = el("tr", r.status === "완료" ? { class: "done" } : {});
      const grade = el("td", { class: `c grade-${r.grade}`, title: `영향도 ${r.impact} / 발생가능성 ${r.likelihood}` }, r.grade);
      const title = el("td"); title.appendChild(el("div", {}, r.title));
      if (r.note) title.appendChild(el("div", { class: "sub" }, r.note));
      const due = el("td", { class: "c" }, r.due ?? "-");
      if (r.overdue) due.replaceChildren(el("span", { class: "due-over" }, r.due), el("div", { class: "sub bad" }, "(기한초과)"));
      tr.append(el("td", { class: "c" }, r.id), grade, title, el("td", { class: "c" }, r.category), el("td", { class: "c" }, r.owner),
                el("td", {}, r.action), el("td", { class: "c" }, r.status), due);
      t.appendChild(tr);
    });
  };
  filters.forEach(([name], i) => {
    const b = el("button", { type: "button", "aria-pressed": String(i === active) }, name);
    b.addEventListener("click", () => {
      active = i;
      [...$("filters").children].forEach((c, j) => c.setAttribute("aria-pressed", String(j === i)));
      renderTable();
    });
    $("filters").appendChild(b);
  });
  renderTable();

  $("footer").textContent = `원본: ${D.meta.source_file}  |  생성: ${D.meta.generated_at.replace("T", " ")}`;
})();
</script>
</body>
</html>
